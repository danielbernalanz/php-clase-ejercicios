services:
  web:
    build: .
    ports:
      - "80:80"
    container_name: web
    hostname: web
    volumes:
      - ../app:/var/www/html

  database:
    image: mysql:latest
    container_name: database
    environment:
      - MYSQL_DATABASE=prueba
      - MYSQL_USER=alumno
      - MYSQL_PASSWORD=alumno
      - MYSQL_ROOT_PASSWORD=alumno

  phpmyadmin:
    image: phpmyadmin
    depends_on:
      - database
    ports:
      - 8100:80
    environment:
      - PMA_HOST=database
      - PMA_ARBITRARY=1
